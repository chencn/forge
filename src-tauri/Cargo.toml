[workspace]
members = [".", "crates/forge-shell-cmd", "crates/forge-shell-ext"]
resolver = "2"

[package]
name = "forge"
version = "1.0.9"
description = "Forge - Tauri desktop app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "forge_lib"
# 桌面端只由 main.rs 静态链接这个 rlib；开 cdylib 会让 GNU ld 的 PE 导出表超限。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：本地图片要经 asset 协议喂给 webview，直接走 file:// 会被 CSP 挡掉。
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
# 应用内更新：updater 负责从 GitHub Releases 检查、下载与装包（Windows 按当前
# 安装方式自动选 MSI 或 NSIS 安装包）；process 只用它的 relaunch 装完重启。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 文本后缀白名单。Win11 新菜单的 DLL 也读这一份，两处不能各写一份。
forge-shell-ext = { path = "crates/forge-shell-ext" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
portable-pty = "0.9.0"
base64 = "0.23.1"
notify = "8"
# 全文搜索：正则走 regex，遍历目录走 walkdir（两者都已锁在依赖树里，不额外下载）。
regex = "1"
walkdir = "2"
# 非 UTF-8 文本（中文老项目的 GBK/GB18030）读写：读时按标签解码，写时按原编码回写。
encoding_rs = "0.8"
# AI 提交生成：直接使用依赖树里已有的 reqwest 与 tokio，不额外下载新库。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
# 更新包缓存读回时重新验签用。updater 插件内部就是这一个版本，显式声明不额外下载。
minisign-verify = "0.3"

# 关掉 WebView2 自带的右键菜单（刷新 / 另存为 / 打印）：桌面应用里不该出现，
# 应用自己的菜单在前端摆。两者都是 tauri 已经锁在依赖树里的版本，不额外下载。
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# proc.rs / lsp.rs 停会话时按进程组整树收（libc::kill 给负 pid 发 SIGKILL）；
# tauri 树里已锁这一份，显式声明不额外下载。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
