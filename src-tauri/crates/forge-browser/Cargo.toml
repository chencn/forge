[package]
name = "forge-browser"
version = "1.1.1"
edition = "2021"

[[bin]]
name = "forge-browser-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt-multi-thread", "macros", "time", "sync"] }
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Threading"] }
